name: Build iOS Xcode Project

on:
  release:
    types: [published]
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-15 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get zip from Release
        run: |
          mkdir -p build
          gh release download --pattern "*.zip" --dir build/
          unzip -q build/*.zip -d build/
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN }}

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Build Unsigned IPA
        run: |
          cd build/
          # Find the .xcodeproj file dynamically
          XCODEPROJ=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          
          echo "Building $XCODEPROJ..."
          
          xcodebuild archive \
            -project "$XCODEPROJ" \
            -scheme Unity-iPhone \
            -configuration Release \
            -archivePath build/Unity-iPhone.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          cp -r build/Unity-iPhone.xcarchive/Products/Applications/*.app Payload/
          zip -qr ARApp.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Build
          path: build/ARApp.ipa
          retention-days: 7
